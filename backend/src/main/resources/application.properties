server.port=8080

# H2 file-based database, stored under ./data relative to the working directory.
spring.datasource.url=jdbc:h2:file:./data/carrymate;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN

# Demo seed data (2 users, 2 trips, 3 requests, 1 deal). Set false to skip.
app.demo-seed=true

# CORS: comma-separated list of allowed origins.
app.cors.allowed-origins=http://localhost:5173,https://dpreddysathi.github.io
